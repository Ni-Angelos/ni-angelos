<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><base target="_top"><meta charset="utf-8">
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#f4f6f8}
  h2{margin:0 0 10px}
  input,button{font-size:16px;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #bbb;box-sizing:border-box}
  input{width:100%} button{background:#1f4e78;color:#fff;border:0;width:100%}
  #reader{width:100%;max-width:420px;margin:8px auto}
  #out,#lmsg{margin:10px 0;padding:14px;border-radius:10px;font-size:18px;display:none;text-align:center}
  .ok{background:#c6efce;color:#1e5a1e}.dup{background:#ffeb9c;color:#7f6000}.bad{background:#ffc7ce;color:#9c0006}
  .p{background:#fff;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ddd}
  #who{font-size:14px;color:#555;margin-bottom:6px}
</style></head><body>
<div id="login">
  <h2>تسجيل الدخول</h2>
  <input id="u" placeholder="الاسم" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button id="in">دخول</button>
  <div id="lmsg" class="bad"></div>
</div>
<div id="app" style="display:none">
  <h2>تسجيل الحضور</h2>
  <div id="who"></div>
  <button id="start">تشغيل الكاميرا</button>
  <button id="shot">📷 صوّر الـ QR بكاميرا الموبايل</button>
  <input id="file" type="file" accept="image/*" capture="environment" style="display:none">
  <div id="reader"></div>
  <div id="out"></div>
  <hr>
  <input id="code" type="number" placeholder="أو اكتب الكود">
  <button id="go">تسجيل بالكود</button>
  <input id="q" placeholder="أو ابحث بالاسم أو الرقم">
  <div id="results"></div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  var TOK = sessionStorage.getItem('tok') || '', USER = sessionStorage.getItem('user') || '';
  var out = document.getElementById('out'), lastTok = '', lastAt = 0, cam = null;

  function showApp() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('who').textContent = 'داخل باسم: ' + USER;
  }
  function showLogin(msg) {
    sessionStorage.clear(); TOK = ''; USER = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    var m = document.getElementById('lmsg');
    if (msg) { m.textContent = msg; m.style.display = 'block'; } else m.style.display = 'none';
  }
  if (TOK) showApp();

  document.getElementById('in').onclick = function () {
    google.script.run.withSuccessHandler(function (r) {
      if (!r.ok) return showLogin(r.msg);
      TOK = r.token; USER = r.user;
      sessionStorage.setItem('tok', TOK); sessionStorage.setItem('user', USER);
      document.getElementById('pw').value = '';
      showApp();
    }).withFailureHandler(function (e) { showLogin('حصل خطأ: ' + e.message); })
      .login(document.getElementById('u').value, document.getElementById('pw').value);
  };

  function show(r) {
    if (r.auth === false) return showLogin(r.msg);
    out.style.display = 'block'; out.textContent = r.msg;
    out.className = !r.ok ? 'bad' : (r.dup ? 'dup' : 'ok');
    if (navigator.vibrate) navigator.vibrate(r.ok && !r.dup ? 120 : [80, 60, 80]);
  }
  function fail(e) { show({ ok: false, msg: '❌ ' + ((e && e.message) ? e.message : String(e)) }); }

  document.getElementById('start').onclick = function () {
    var btn = this;
    cam = cam || new Html5Qrcode('reader');
    cam.start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 }, function (text) {
      var now = Date.now();
      if (text === lastTok && now - lastAt < 4000) return;
      lastTok = text; lastAt = now;
      google.script.run.withSuccessHandler(show).withFailureHandler(fail).scanToken(TOK, text);
    }).then(function () { btn.style.display = 'none'; })
      .catch(function (e) {
        show({ ok: false, msg: '❌ الكاميرا ما اشتغلتش: ' + ((e && e.message) ? e.message : String(e)) + ' — جرّب زرار "صوّر الـ QR"، أو افتح الرابط من Chrome مش من واتساب' });
      });
  };

  document.getElementById('shot').onclick = function () { document.getElementById('file').click(); };
  document.getElementById('file').onchange = function () {
    var f = this.files[0], input = this;
    if (!f) return;
    cam = cam || new Html5Qrcode('reader');
    cam.scanFile(f, false).then(function (text) {
      google.script.run.withSuccessHandler(show).withFailureHandler(fail).scanToken(TOK, text);
    }).catch(function () { show({ ok: false, msg: '❌ ما قدرتش أقرا الـ QR من الصورة، قرّب وجرّب تاني' }); });
    input.value = '';
  };

  document.getElementById('go').onclick = function () {
    var c = document.getElementById('code').value; if (!c) return;
    google.script.run.withSuccessHandler(show).withFailureHandler(fail).manualCode(TOK, c);
  };

  var t;
  document.getElementById('q').oninput = function () {
    clearTimeout(t); var v = this.value;
    t = setTimeout(function () {
      google.script.run.withSuccessHandler(function (list) {
        var box = document.getElementById('results'); box.innerHTML = '';
        list.forEach(function (p) {
          var d = document.createElement('div'); d.className = 'p';
          d.textContent = p.name + ' (كود ' + p.code + ')' + (p.tag && p.tag.indexOf('ID') === 0 ? ' - ' + p.tag : '');
          d.onclick = function () {
            google.script.run.withSuccessHandler(show).withFailureHandler(fail).manualCode(TOK, p.code);
            box.innerHTML = '';
          };
          box.appendChild(d);
        });
      }).searchPeople(TOK, v);
    }, 350);
  };
</script></body></html>
