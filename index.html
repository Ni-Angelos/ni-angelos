<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الحضور</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#f4f6f8}
  h2{margin:0 0 10px}
  input,button{font-size:16px;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #bbb;box-sizing:border-box}
  input{width:100%} button{background:#1f4e78;color:#fff;border:0;width:100%}
  button.sec{background:#fff;color:#1f4e78;border:1px solid #1f4e78}
  button:disabled{opacity:.6}
  #reader{width:100%;max-width:420px;margin:8px auto}
  #out,#lmsg{margin:10px 0;padding:14px;border-radius:10px;font-size:18px;display:none;text-align:center}
  .ok{background:#c6efce;color:#1e5a1e}.dup{background:#ffeb9c;color:#7f6000}.bad{background:#ffc7ce;color:#9c0006}.info{background:#e3effa;color:#1f4e78}
  .p{background:#fff;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ddd}
  #who{font-size:14px;color:#555;margin-bottom:6px}
</style></head><body>
<script>
  window.onerror = function (m, s, l) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="background:#fcc;color:#900;padding:10px;margin:6px 0;font-size:14px;direction:ltr">JS error: ' + m + ' (line ' + l + ')</div>');
  };
</script>
<div id="login">
  <h2>تسجيل الدخول</h2>
  <input id="u" placeholder="الاسم" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button id="in">دخول</button>
  <div id="lmsg"></div>
</div>
<div id="app" style="display:none">
  <h2>تسجيل الحضور</h2>
  <div id="who"></div>
  <button id="start">تسجيل</button>
  <div id="reader"></div>
  <div id="out"></div>
  <hr>
  <input id="code" type="number" placeholder="أو اكتب الكود">
  <button id="go">تسجيل بالكود</button>
  <input id="q" placeholder="أو ابحث بالاسم أو الرقم">
  <div id="results"></div>
  <button id="logout" class="sec">تسجيل خروج</button>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  var API = 'https://script.google.com/macros/s/AKfycbyxbwv4gNMDrgtaN4Vu2e7AQkPhNnb9X8TYRzN-cv2z9KO2LtcWoibaumNrUd9OIfhM/exec';

  var TOK = localStorage.getItem('tok') || '', USER = localStorage.getItem('user') || '';
  var out = document.getElementById('out'), cam = null;

  function call(payload) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 25000);
    return fetch(API, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal })
      .then(function (r) { clearTimeout(timer); return r.text(); })
      .then(function (t) {
        try { return JSON.parse(t); }
        catch (e) {
          var hint = /<html|<!doctype/i.test(t)
            ? 'السيرفر رجّع صفحة بدل بيانات. غالبًا النشر مش مفتوح للكل (Anyone) أو مفيش New version'
            : t.slice(0, 120);
          throw new Error(hint);
        }
      })
      .catch(function (e) {
        clearTimeout(timer);
        if (e && e.name === 'AbortError') throw new Error('السيرفر اتأخر أكتر من 25 ثانية، جرّب تاني');
        throw e;
      });
  }
  function lmsg(text, cls) {
    var m = document.getElementById('lmsg');
    if (!text) { m.style.display = 'none'; return; }
    m.className = cls || 'bad'; m.textContent = text; m.style.display = 'block';
  }
  function showApp() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('who').textContent = 'داخل باسم: ' + USER;
  }
  function showLogin(msg) {
    localStorage.removeItem('tok'); localStorage.removeItem('user'); TOK = ''; USER = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    lmsg(msg, 'bad');
  }
  function show(r) {
    if (r.auth === false) return showLogin(r.msg);
    out.style.display = 'block'; out.textContent = r.msg;
    out.className = !r.ok ? 'bad' : (r.dup ? 'dup' : 'ok');
    if (navigator.vibrate) navigator.vibrate(r.ok && !r.dup ? 120 : [80, 60, 80]);
  }
  function fail(e) { show({ ok: false, msg: '❌ ' + ((e && e.message) ? e.message : String(e)) }); }
  if (TOK) showApp();

  document.getElementById('in').onclick = function () {
    var btn = this, name = document.getElementById('u').value, pw = document.getElementById('pw').value;
    if (!name || !pw) { lmsg('اكتب الاسم وكلمة السر', 'bad'); return; }
    btn.disabled = true; lmsg('جاري الدخول…', 'info');
    call({ action: 'login', name: name, password: pw })
      .then(function (r) {
        btn.disabled = false;
        if (!r.ok) return lmsg(r.msg || 'الدخول فشل', 'bad');
        TOK = r.token; USER = r.user;
        localStorage.setItem('tok', TOK); localStorage.setItem('user', USER);
        document.getElementById('pw').value = '';
        lmsg('');
        showApp();
      }).catch(function (e) {
        btn.disabled = false;
        lmsg('حصل خطأ في الاتصال: ' + e.message, 'bad');
      });
  };
  document.getElementById('logout').onclick = function () { showLogin(''); };

  function sendScan(text) {
    call({ action: 'scan', tok: TOK, token: text }).then(show).catch(fail);
  }

  // زرار تسجيل: يفتح الكاميرا، يقرأ QR واحد، يبعته، يقفل الكاميرا، ومايفتحش تاني غير بالضغط
  document.getElementById('start').onclick = function () {
    var btn = this, done = false;
    cam = cam || new Html5Qrcode('reader');
    btn.style.display = 'none';
    out.style.display = 'none';
    cam.start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 }, function (text) {
      if (done) return;
      done = true;
      cam.stop().then(function () { cam.clear(); btn.style.display = 'block'; })
        .catch(function () { btn.style.display = 'block'; });
      sendScan(text);
    }).catch(function (e) {
      btn.style.display = 'block';
      show({ ok: false, msg: '❌ الكاميرا ما اشتغلتش: ' + ((e && e.message) ? e.message : String(e)) + ' — اسمح للكاميرا من إعدادات المتصفح' });
    });
  };

  document.getElementById('go').onclick = function () {
    var c = document.getElementById('code').value; if (!c) return;
    call({ action: 'code', tok: TOK, code: c }).then(show).catch(fail);
  };
  var t;
  document.getElementById('q').oninput = function () {
    clearTimeout(t); var v = this.value;
    t = setTimeout(function () {
      call({ action: 'search', tok: TOK, q: v }).then(function (list) {
        var box = document.getElementById('results'); box.innerHTML = '';
        if (!Array.isArray(list)) return;
        list.forEach(function (p) {
          var d = document.createElement('div'); d.className = 'p';
          d.textContent = p.name + ' (كود ' + p.code + ')' + (p.tag && p.tag.indexOf('ID') === 0 ? ' - ' + p.tag : '');
          d.onclick = function () {
            call({ action: 'code', tok: TOK, code: p.code }).then(show).catch(fail);
            box.innerHTML = '';
          };
          box.appendChild(d);
        });
      }).catch(fail);
    }, 350);
  };
</script>
</body></html>
